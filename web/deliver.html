<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>投递口 · 咕咕的小房间</title><link rel="stylesheet" href="admin.css"></head><body><main><header><span>GUGU’S POSTBOX</span><h1>放一点小东西。</h1><p>这里是你的投递口。他的房间、记录与访问情况不会出现在这里。</p></header><section id="login"><h2 id="auth-title">打开投递口</h2><form id="auth-form"><label>投递密码<input type="password" id="password" autocomplete="current-password" required minlength="12" maxlength="128"></label><button id="auth-submit">进入</button></form><p id="setup-help" hidden>首次使用请通过创建者的初始化链接设置密码。</p></section><div id="studio" hidden><div class="topline"><a href="/" target="_blank" rel="noopener">打开房间 ↗</a><button id="logout" class="quiet">退出投递口</button></div><section><h2>这次放什么</h2><form id="delivery-form"><div class="pair"><label>内容类型<select id="type"><option value="note">手写小纸条</option><option value="photo">照片</option><option value="drawing">手绘 / 涂鸦</option><option value="audio">几秒声音</option><option value="record">一张唱片</option><option value="meme">战术桌小图</option><option value="egg">藏起来的小东西</option><option value="text">几句话</option></select></label><label>放在哪里<select id="slot"><option value="sill">窗台</option><option value="box">咕咕旁的小盒子</option><option value="pocket">咕咕的口袋</option><option value="art">墙上的挂画位</option><option value="drawer">抽屉</option><option value="record">唱片机里</option><option value="airdrop">空投箱</option><option value="tactical">战术桌墙面</option></select></label></div><label>更适合什么时候看见<select id="phase"><option value="all">任何时候</option><option value="morning">早上</option><option value="day">中午</option><option value="evening">傍晚</option><option value="night">夜里</option></select></label><div id="song-picker" hidden><label>选择你准备的歌<select id="song"></select></label><p>选择歌名后，在下面上传对应的 MP3 / M4A 等音频（不超过 12 MB）。歌名本身不能播放。</p></div><label>小标题（可以不写）<input id="title" maxlength="100" placeholder="例如：今天路过的一朵花"></label><label>几句话（可以不写）<textarea id="text" maxlength="3000" rows="5" placeholder=""></textarea></label><label class="upload">选择图片 / 音频，或用手机拍照<input id="file" type="file" accept="image/png,image/jpeg,image/webp,audio/mpeg,audio/mp4,audio/wav,audio/ogg,audio/webm"></label><small>图片或音频不超过 12 MB；音频只会在他主动点击后播放。</small><div class="preview" id="preview"></div><div class="pair actions"><button type="button" id="record-voice" class="secondary">录一段声音</button><button type="button" id="draw-toggle" class="secondary">画一张小画</button></div><div id="drawing" hidden><canvas id="draw" width="700" height="450" aria-label="涂鸦画布"></canvas><div class="pair"><input aria-label="画笔颜色" type="color" id="ink" value="#697d66"><button type="button" id="draw-clear" class="quiet">擦掉</button><button type="button" id="draw-use">用这张画</button></div></div><button class="submit" id="send">放进房间</button></form></section><section><h2>一个安静的小蛋糕</h2><form id="birthday-form"><div class="pair"><label>生日月份<select id="birthday-month"><option value="">不设置</option></select></label><label>生日日期<select id="birthday-day"><option value="">不设置</option></select></label></div><p>只保存月和日。那天房间会多一个蛋糕，不弹窗、不提醒。</p><button>保存生日</button><button type="button" id="birthday-clear" class="quiet">取消蛋糕</button></form></section><section><h2>已经放进去的东西</h2><p>这里仅列出你的投递。没有已读、播放次数或访问记录。</p><div id="entries"></div></section></div><p id="status" role="status" aria-live="polite"></p><footer>房间里的布置、相框和小本子只存在他的设备里。</footer></main><script src="playlist.js"></script><script src="admin.js"></script></body></html>
